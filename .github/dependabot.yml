version: 2
updates:
- package-ecosystem: bundler
  directory: "/"
  target-branch: develop # PRの向き先をdevelopに固定
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  groups:
    # パッチ・マイナー更新は1つのPRにまとめる（メジャー更新は個別PRのまま）
    bundler-minor-and-patch:
      update-types:
        - minor
        - patch
- package-ecosystem: github-actions
  directory: "/"
  target-branch: develop # PRの向き先をdevelopに固定
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  groups:
    # GitHub Actionsの更新は全て1つのPRにまとめる
    github-actions:
      patterns:
        - "*"
